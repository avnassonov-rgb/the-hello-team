<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE HELLO Team — вход</title>
<script>(function(){try{var t=localStorage.getItem("theme");if(!t)t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<link rel="stylesheet" href="/css/brand.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 80% -10%,var(--pink-soft),transparent),var(--bg);}
  .loginwrap{width:100%;max-width:400px;padding:20px;}
  .loginlogo{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px;}
  .loginlogo img{width:68px;height:68px;border-radius:50%;object-fit:cover;box-shadow:var(--shadow-lg);}
  .loginlogo .wm{font-family:'Montserrat','Onest',sans-serif;font-size:22px;font-weight:800;letter-spacing:.02em;color:var(--accent-text);}
  .logincard{padding:32px 30px;}
  .logincard h1{font-size:19px;margin:0 0 4px;font-weight:800;}
  .logincard p.sub{font-size:13px;color:var(--muted);margin:0 0 22px;}
  .pwfield{position:relative;margin-bottom:16px;}
  .pwfield input{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;letter-spacing:1px;background:var(--surface-2);color:var(--text);}
  .pwfield input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft);}
  .loginbtn{width:100%;padding:13px;border-radius:12px;font-size:14.5px;}
  .err{background:var(--pink-soft);color:var(--accent-text);font-size:12.5px;font-weight:600;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:none;}
  .err.show{display:block;}
  .loginfoot{text-align:center;margin-top:18px;font-size:11.5px;color:var(--muted);}
</style>
</head>
<body>
  <div class="loginwrap">
    <div class="loginlogo">
      <img src="/img/logo-badge.png" alt="THE HELLO Team">
      <div class="wm">THE HELLO TEAM</div>
    </div>
    <div class="card logincard">
      <h1>Вход в систему</h1>
      <p class="sub">Рабочий дашборд · общий доступ по паролю</p>
      <div class="err" id="err">Неверный пароль. Попробуйте ещё раз.</div>
      <form id="loginForm" autocomplete="off">
        <div class="pwfield">
          <input type="password" id="password" name="password" placeholder="Пароль" autocomplete="current-password" autofocus required>
        </div>
        <button type="submit" class="btn btn-pink loginbtn" id="loginBtn">Войти</button>
      </form>
    </div>
    <div class="loginfoot">© THE HELLO Team / ПЧЁЛКА — внутренняя система</div>
  </div>
<script src="/js/login.js"></script>
</body>
</html>
